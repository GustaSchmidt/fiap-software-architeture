apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiap-app
  labels:
    app: soat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soat-app
  template:
    metadata:
      labels:
        app: soat-app
    spec:
      containers:
      - name: soat-app
        image: soat-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              name: soat-secrets
              key: app_key
        - name: DB_CONNECTION
          value: pgsql
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: soat-secrets
              key: db_host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: soat-secrets
              key: db_port
        - name: DB_DATABASE
          valueFrom:
            secretKeyRef:
              name: soat-secrets
              key: db_database
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: soat-secrets
              key: db_username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: soat-secrets
              key: db_password
        - name: REDIS_HOST
          value: redis-service
