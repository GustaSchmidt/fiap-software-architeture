apiVersion: apps/v1
kind: Deployment
metadata:
  name: totem-frontend
  labels:
    app: totem-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: totem-frontend
  template:
    metadata:
      labels:
        app: totem-frontend
    spec:
      containers:
      - name: totem-frontend
        image: totem-frontend:latest # Substituir pela imagem do seu ECR no pipeline
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: API_URL
          value: "http://fiap-app-service"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"