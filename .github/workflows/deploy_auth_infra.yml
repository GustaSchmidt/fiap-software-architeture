name: Deploy Auth Infra (Lambda + API Gateway)

on:
  # Aciona no merge para a branch 'main'
  push:
    branches:
      - main
    paths:
      - 'terraform/auth/**'
      - 'lambda_auth_cpf/**'

  # Aciona na criação/atualização de um Pull Request para a branch 'main'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/auth/**'
      - 'lambda_auth_cpf/**'

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write 

    steps:
      - name: Checkout - Repo clone
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Ou a região que você definiu

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: ./terraform/auth

      #    Executa APENAS se o evento for um Pull Request
      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          # Executa o plan e captura a saída para uma variável de ambiente
          PLAN_OUTPUT=$(terraform plan -no-color -input=false)
          # Usa um marcador de fim de arquivo para lidar com saídas de múltiplas linhas
          echo "plan_output<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        working-directory: ./terraform/auth
        continue-on-error: true # Continua mesmo se o plan falhar para poder postar o erro

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan 📖

            <details><summary>Clique para ver os detalhes</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.plan_output }}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      #    Executa APENAS se o evento for um push na branch 'main' (após o merge)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
        working-directory: ./terraform/auth