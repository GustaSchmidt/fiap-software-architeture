name: Deploy Infrastructure

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ###################################################
  # Job 1: Descobre quais arquivos foram alterados  #
  ###################################################
  list-changed-files:
    name: 'List Changed Files'
    runs-on: ubuntu-latest
    outputs:
      auth_changed: ${{ steps.changed-auth-files.outputs.any_changed }}
      database_changed: ${{ steps.changed-database-files.outputs.any_changed }}
      k8s_changed: ${{ steps.changed-k8s-files.outputs.any_changed }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Check for changes in auth files
        id: changed-auth-files
        uses: tj-actions/changed-files@v44
        with:
          # O input correto é 'files'
          files: |
            terraform/auth/**
            lambda_auth_cpf/**

      - name: Check for changes in database files
        id: changed-database-files
        uses: tj-actions/changed-files@v44
        with:
          # Usamos a action uma segunda vez para o outro caminho
          files: |
            terraform/database/**
      
      - name: Check for changes in kubernetes files
        id: changed-k8s-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            terraform/kubernetes/**
            kubernetes/**

  #########################################
  # Job 2: Infra do Banco de Dados        #
  #########################################
  deploy-database-infra:
    name: 'Terraform Deploy Database Infra'
    # needs: [list-changed-files]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/database
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          PLAN_OUTPUT=$(terraform plan -no-color -input=false)
          echo "plan_output<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        working-directory: ./terraform/database
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        continue-on-error: true

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/post-terraform-plan
        with:
          plan_output: ${{ steps.plan.outputs.plan_output }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Apply
        # if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
        working-directory: ./terraform/database
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}


  #########################################
  # Job 3: Infra de Autenticação          #
  #########################################
  deploy-auth-infra:
    name: 'Terraform Deploy Auth Infra'
    needs: [deploy-database-infra]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Package and Upload Lambda Code
        id: package-lambda
        run: |
          # 1. Determina o nome da branch
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH_NAME="${{ github.head_ref }}"
          else
            # Fallback seguro ou usar github.ref_name para push
            BRANCH_NAME="${{ github.ref_name }}" 
          fi

          # 2. Sanitiza (troca / por - e remove caracteres especiais)
          BRANCH_NAME_SANITIZED=$(echo $BRANCH_NAME | sed 's/[^a-zA-Z0-9]/-/g')
          
          # 3. Pega o SHA de forma segura usando git (garante que não venha vazio)
          COMMIT_SHA=$(git rev-parse --short HEAD)

          # 4. Define o SUFIXO da versão (Isso é o que o Terraform precisa!)
          # Exemplo: minha-branch-a1b2c3d
          VERSION_SUFFIX="${BRANCH_NAME_SANITIZED}-${COMMIT_SHA}"

          S3_KEY="lambda-auth-${VERSION_SUFFIX}.zip"
          BUCKET_NAME="fiap-soat-lambda-code-artifacts"

          echo "--- Debug Infos ---"
          echo "Branch: $BRANCH_NAME_SANITIZED"
          echo "SHA: $COMMIT_SHA"
          echo "Sufixo enviado ao TF: $VERSION_SUFFIX"
          echo "Arquivo S3: $S3_KEY"

          # 5. Instala dependencias e zipa tudo
          cd lambda_auth_cpf
          npm install --production
          zip -r ../${S3_KEY} .
          cd ..
          
          # 6. Upload
          aws s3 cp ${S3_KEY} s3://${BUCKET_NAME}/${S3_KEY}

          # 7. O PULO DO GATO:
          # Envia o SUFIXO COMPLETO para o Terraform, para bater com a chave S3
          echo "commit_sha=$VERSION_SUFFIX" >> $GITHUB_OUTPUT

        env:
          GITHUB_SHA: ${{ github.sha }}


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/auth
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          PLAN_OUTPUT=$(terraform plan -no-color -input=false)
          echo "plan_output<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        working-directory: ./terraform/auth
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_lambda_code_version: ${{ steps.package-lambda.outputs.commit_sha }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        continue-on-error: true

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/post-terraform-plan
        with:
          plan_output: ${{ steps.plan.outputs.plan_output }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
        working-directory: ./terraform/auth
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_lambda_code_version: ${{ steps.package-lambda.outputs.commit_sha }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          
  #########################################
  # Job 4: Infra do Cluster Kubernets     #
  #########################################
  deploy-kubernetes-infra:
    name: 'Terraform Deploy K8s Infra'
    needs: [deploy-database-infra]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/kubernetes
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - name: Sleep to avoid other concurrent runs on Terraform Cloud
        run: |
          sleep 10

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          PLAN_OUTPUT=$(terraform plan -no-color -input=false 2>&1)
          echo "plan_output<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        working-directory: ./terraform/kubernetes
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        continue-on-error: true

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/post-terraform-plan
        with:
          plan_output: ${{ steps.plan.outputs.plan_output }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
        working-directory: ./terraform/kubernetes
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

  #########################################
  # Job 5: Deploy App to EKS              #
  #########################################
  deploy-k8s-app:
    name: 'Deploy App to EKS'
    needs: [deploy-kubernetes-infra]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: fiap-soat-app
          IMAGE_TAG: ${{ github.sha }} # <--- Usaremos o SHA do commit para versionar
        run: |
          # Build e Push com a TAG única do commit (Boa prática)
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # Também atualiza a latest (opcional, mas bom para cache)
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Salva a imagem completa com a TAG específica para usar no próximo passo
          echo "FULL_IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name fiap-soat-cluster

      - name: Create Database Secret
        run: |
          kubectl create secret generic db-credentials \
            --from-literal=DB_HOST=${{ secrets.DB_HOST }} \
            --from-literal=DB_PORT=5432 \
            --from-literal=DB_DATABASE=fiap_soat \
            --from-literal=DB_USERNAME=fiap_db_user_main \
            --from-literal=DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Manifests
        run: |
          kubectl apply -f kubernets/configmap.yaml
          kubectl apply -f kubernets/redis-deployment.yaml
          kubectl apply -f kubernets/redis-service.yaml
          kubectl apply -f kubernets/deployment.yaml
          kubectl apply -f kubernets/service.yaml
          kubectl apply -f kubernets/hpa.yaml

      - name: Update Image, Wait Rollout & Report
        run: |
          echo "========================================================"
          echo "🚀 INICIANDO ATUALIZAÇÃO DE IMAGEM"
          echo "Imagem alvo: ${{ env.FULL_IMAGE }}"
          echo "========================================================"

          echo "🔄 Enviando comando 'set image' para o Cluster..."
          kubectl set image deployment/fiap-app fiap-app=${{ env.FULL_IMAGE }}

          echo "⏳ Aguardando estabilização dos Pods (Rollout Status)..."
          
          if kubectl rollout status deployment/fiap-app --timeout=5m; then
            echo "✅ Rollout concluído com SUCESSO!"
          else
            echo "❌ O Rollout falhou ou demorou demais!"
            echo "🔍 Diagnóstico de Falha:"
            kubectl get pods -l app=fiap-app
            echo "--- Logs recentes dos pods ---"
            kubectl logs -l app=fiap-app --tail=50 --all-containers=true
            exit 1 # Força a falha do Job
          fi

          echo "========================================================"
          echo "🎉 RELATÓRIO FINAL DO CLUSTER"
          echo "========================================================"
          
          echo "🔎 DEPLOYMENTS:"
          kubectl get deployments -o wide
          
          echo ""
          echo "🔎 PODS (Status atual):"
          kubectl get pods -o wide
          
          echo ""
          echo "🔎 SERVICES (Seu Link de Acesso):"
          kubectl get services
          
          echo ""
          echo "🔎 IMAGEM RODANDO AGORA:"
          kubectl get deployment fiap-app -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo ""
          echo "========================================================"