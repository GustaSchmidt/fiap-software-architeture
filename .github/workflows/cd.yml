name: Deploy Infrastructure And APPs (CD)

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ###################################################
  # Job 1: Descobre quais arquivos foram alterados  #
  ###################################################
  list-changed-files:
    name: 'List Changed Files'
    runs-on: ubuntu-latest
    outputs:
      auth_changed: ${{ steps.changed-auth-files.outputs.any_changed }}
      database_changed: ${{ steps.changed-database-files.outputs.any_changed }}
      k8s_changed: ${{ steps.changed-k8s-files.outputs.any_changed }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Check for changes in auth files
        id: changed-auth-files
        uses: tj-actions/changed-files@v44
        with:
          # O input correto é 'files'
          files: |
            terraform/auth/**
            lambda_auth_cpf/**

      - name: Check for changes in database files
        id: changed-database-files
        uses: tj-actions/changed-files@v44
        with:
          # Usamos a action uma segunda vez para o outro caminho
          files: |
            terraform/database/**
      
      - name: Check for changes in kubernetes files
        id: changed-k8s-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            terraform/kubernetes/**
            kubernetes/**

  #########################################
  # Job 2: Infra do Banco de Dados        #
  #########################################
  deploy-database-infra:
    name: 'Terraform Deploy Database Infra'
    needs: [list-changed-files]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    
    outputs:
      db_host: ${{ steps.get-outputs.outputs.db_host }}
      db_port: ${{ steps.get-outputs.outputs.db_port }}
      db_name: ${{ steps.get-outputs.outputs.db_name }}
      db_user: ${{ steps.get-outputs.outputs.db_user }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/database
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          PLAN_OUTPUT=$(terraform plan -no-color -input=false)
          echo "plan_output<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        working-directory: ./terraform/database
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        continue-on-error: true

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/post-terraform-plan
        with:
          plan_output: ${{ steps.plan.outputs.plan_output }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Apply
        id: apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: ./terraform/database
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          terraform apply -auto-approve -input=false

          echo "Terraform Apply completed."

      - name: Terraform Outputs
        id: get-outputs
        working-directory: ./terraform/database
        run: |
          echo "Extracting outputs..."
          terraform output -json
          
          DB_HOST=$(terraform output -raw db_host | tr -d '\n\r')
          DB_PORT=$(terraform output -raw db_port | tr -d '\n\r')
          DB_NAME=$(terraform output -raw db_name | tr -d '\n\r')
          DB_USER=$(terraform output -raw db_username | tr -d '\n\r')

          if [ -z "$DB_HOST" ]; then
            echo "ERRO: Terraform output db_host retornou vazio!"
            exit 1
          fi

          # Pega os valores brutos (-raw) do terraform e joga no output do GitHub
          echo "db_host=$DB_HOST" >> $GITHUB_OUTPUT
          echo "db_port=$DB_PORT" >> $GITHUB_OUTPUT
          echo "db_name=$DB_NAME" >> $GITHUB_OUTPUT
          echo "db_user=$DB_USER" >> $GITHUB_OUTPUT

  #########################################
  # Job 3: Infra de Autenticação          #
  #########################################
  deploy-auth-infra:
    name: 'Terraform Deploy Auth Infra'
    needs: [deploy-database-infra]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Package and Upload Lambda Code
        id: package-lambda
        run: |
          # 1. Determina o nome da branch
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH_NAME="${{ github.head_ref }}"
          else
            # Fallback seguro ou usar github.ref_name para push
            BRANCH_NAME="${{ github.ref_name }}" 
          fi

          # 2. Sanitiza (troca / por - e remove caracteres especiais)
          BRANCH_NAME_SANITIZED=$(echo $BRANCH_NAME | sed 's/[^a-zA-Z0-9]/-/g')
          
          # 3. Pega o SHA de forma segura usando git (garante que não venha vazio)
          COMMIT_SHA=$(git rev-parse --short HEAD)

          # 4. Define o SUFIXO da versão (Isso é o que o Terraform precisa!)
          # Exemplo: minha-branch-a1b2c3d
          VERSION_SUFFIX="${BRANCH_NAME_SANITIZED}-${COMMIT_SHA}"

          S3_KEY="lambda-auth-${VERSION_SUFFIX}.zip"
          BUCKET_NAME="fiap-soat-lambda-code-artifacts"

          echo "--- Debug Infos ---"
          echo "Branch: $BRANCH_NAME_SANITIZED"
          echo "SHA: $COMMIT_SHA"
          echo "Sufixo enviado ao TF: $VERSION_SUFFIX"
          echo "Arquivo S3: $S3_KEY"

          # 5. Instala dependencias e zipa tudo
          cd lambda_auth_cpf
          npm install --production
          zip -r ../${S3_KEY} .
          cd ..
          
          # 6. Upload
          aws s3 cp ${S3_KEY} s3://${BUCKET_NAME}/${S3_KEY}

          # 7. O PULO DO GATO:
          # Envia o SUFIXO COMPLETO para o Terraform, para bater com a chave S3
          echo "commit_sha=$VERSION_SUFFIX" >> $GITHUB_OUTPUT

        env:
          GITHUB_SHA: ${{ github.sha }}


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/auth
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          PLAN_OUTPUT=$(terraform plan -no-color -input=false)
          echo "plan_output<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        working-directory: ./terraform/auth
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_lambda_code_version: ${{ steps.package-lambda.outputs.commit_sha }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        continue-on-error: true

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/post-terraform-plan
        with:
          plan_output: ${{ steps.plan.outputs.plan_output }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
        working-directory: ./terraform/auth
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_lambda_code_version: ${{ steps.package-lambda.outputs.commit_sha }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          
  #########################################
  # Job 4: Infra do Cluster Kubernets     #
  #########################################
  deploy-kubernetes-infra:
    name: 'Terraform Deploy K8s Infra'
    needs: [deploy-database-infra]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform/kubernetes
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - name: Sleep to avoid other concurrent runs on Terraform Cloud
        run: |
          sleep 10

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: |
          PLAN_OUTPUT=$(terraform plan -no-color -input=false 2>&1)
          echo "plan_output<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        working-directory: ./terraform/kubernetes
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        continue-on-error: true

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/post-terraform-plan
        with:
          plan_output: ${{ steps.plan.outputs.plan_output }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
        working-directory: ./terraform/kubernetes
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

  #########################################
  # Job 5: Deploy App to EKS              #
  #########################################
  deploy-k8s-app:
    name: 'Deploy App to EKS'
    needs: [deploy-kubernetes-infra, deploy-database-infra]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      load_balancer_url: ${{ steps.get-url.outputs.lb_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: fiap-soat-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build e Push com a TAG única do commit (Boa prática)
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # Também atualiza a latest (opcional, mas bom para cache)
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # Salva a imagem completa com a TAG específica para usar no próximo passo
          echo "FULL_IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name fiap-soat-cluster

      - name: Generate Random App Key
        run: |
          # Gera uma chave randômica de 32 bytes em base64
          # O Laravel exige o prefixo "base64:"
          RANDOM_KEY="base64:$(openssl rand -base64 32)"
          
          # 1. Mascara a chave (Segurança: troca por *** nos logs)
          echo "::add-mask::$RANDOM_KEY"
          
          # 2. Salva na ENV do GitHub para os próximos passos usarem
          echo "GENERATED_APP_KEY=$RANDOM_KEY" >> $GITHUB_ENV

      - name: Create Database Secret
        run: |
          # Usamos o nome 'soat-secrets' e chaves minúsculas para bater com seu YAML
          kubectl create secret generic soat-secrets \
            --from-literal=db_host='${{ needs.deploy-database-infra.outputs.db_host }}' \
            --from-literal=db_port='${{ needs.deploy-database-infra.outputs.db_port }}' \
            --from-literal=db_database='${{ needs.deploy-database-infra.outputs.db_name }}' \
            --from-literal=db_username='${{ needs.deploy-database-infra.outputs.db_user }}' \
            --from-literal=db_password='${{ secrets.DB_PASSWORD }}' \
            --from-literal=app_key='${{ env.GENERATED_APP_KEY }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Manifests
        run: |
          kubectl apply -f kubernets/configmap.yaml
          kubectl apply -f kubernets/redis-deployment.yaml
          kubectl apply -f kubernets/redis-service.yaml
          kubectl apply -f kubernets/deployment.yaml
          kubectl apply -f kubernets/service.yaml
          kubectl apply -f kubernets/hpa.yaml

      - name: Update Image, Wait Rollout & Report
        run: |
          echo "========================================================"
          echo "🚀 INICIANDO ATUALIZAÇÃO INTELIGENTE"
          echo "Imagem alvo: ${{ env.FULL_IMAGE }}"
          echo "========================================================"

          kubectl set image deployment/fiap-app soat-app=${{ env.FULL_IMAGE }}

          # 2. Loop de Monitoramento (Fail Fast)
          # Tenta por 5 minutos (30 tentativas de 10s). Se detectar erro, aborta.
          ATTEMPTS=0
          MAX_ATTEMPTS=30
          
          echo "⏳ Monitorando estabilidade dos Pods..."
          
          while [ $ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            ATTEMPTS=$((ATTEMPTS+1))
            sleep 10

            # A) Verifica se o rollout terminou com sucesso
            if kubectl rollout status deployment/fiap-app --timeout=1s >/dev/null 2>&1; then
              echo "✅ Rollout concluído com SUCESSO!"
              break
            fi

            # B) Verifica se tem Pods em estado CRÍTICO (Loop, Erro de Imagem, Config)
            ERROR_PODS=$(kubectl get pods -l app=soat-app -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.containerStatuses[0].state.waiting.reason}{"\n"}{end}' | grep -E "CrashLoopBackOff|ErrImagePull|ImagePullBackOff|CreateContainerConfigError" || true)
            
            if [ ! -z "$ERROR_PODS" ]; then
              echo "❌ ERRO CRÍTICO DETECTADO! Abortando deploy."
              echo "Os seguintes pods estão falhando:"
              echo "$ERROR_PODS"
              
              echo "--- 🔍 Diagnóstico Rápido (Logs) ---"
              # Pega o nome do primeiro pod com erro para mostrar log
              BAD_POD=$(echo $ERROR_PODS | awk '{print $1}')
              kubectl logs $BAD_POD --previous --tail=20 2>/dev/null || kubectl logs $BAD_POD --tail=20
              kubectl describe pod $BAD_POD | grep -A 10 "Events:"
              
              exit 1 # FALHA O JOB IMEDIATAMENTE
            fi

            echo "   ... tentativa $ATTEMPTS/$MAX_ATTEMPTS: Rollout em andamento..."
          done

          # C) Se saiu do loop pelo limite de tempo
          if [ $ATTEMPTS -eq $MAX_ATTEMPTS ]; then
             echo "❌ Timeout! O deploy demorou mais de 5 minutos."
             exit 1
          fi

          echo "========================================================"
          echo "🎉 RELATÓRIO FINAL DO CLUSTER"
          echo "========================================================"
          
          echo "🔎 DEPLOYMENTS:"
          kubectl get deployments -o wide
          
          echo ""
          echo "🔎 PODS (Status atual):"
          kubectl get pods -o wide
          
          echo ""
          echo "🔎 SERVICES (Seu Link de Acesso):"
          kubectl get services
          
          echo ""
          echo "🔎 IMAGEM RODANDO AGORA:"
          kubectl get deployment fiap-app -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo ""
          echo "========================================================"
      
      - name: Get LoadBalancer URL
        id: get-url
        run: |
          # Pega o hostname do LoadBalancer direto do Kubernetes
          LB_HOSTNAME=$(kubectl get service fiap-app-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          
          # Se vier vazio (ainda provisionando), coloca uma mensagem de aviso
          if [ -z "$LB_HOSTNAME" ]; then
            LB_HOSTNAME="Ainda em provisionamento (verifique no AWS Console)"
          else
            LB_HOSTNAME="http://$LB_HOSTNAME"
          fi
          
          echo "URL detectada: $LB_HOSTNAME"
          echo "lb_url=$LB_HOSTNAME" >> $GITHUB_OUTPUT

  #########################################
  # Job 6: Debug Automático (Só se falhar)#
  #########################################
  debug-k8s-failure:
    name: '🔍 Debug Kubernetes Failure'
    needs: [deploy-kubernetes-infra, deploy-k8s-app]       
    if: failure()
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name fiap-soat-cluster --region us-east-1

      - name: 🚨 Relatório Completo de Erro
        run: |
          echo "========================================================"
          echo "🕵️‍♂️ INICIANDO INVESTIGAÇÃO AUTOMÁTICA"
          echo "========================================================"
          
          echo ""
          echo "1️⃣ STATUS DOS PODS:"
          kubectl get pods -o wide
          
          echo ""
          echo "========================================================"
          echo "2️⃣ ANALISANDO PODS COM ERRO..."
          
          # Pega todos os pods do app (ajuste o label se necessário)
          PODS=$(kubectl get pods -l app=soat-app -o jsonpath='{.items[*].metadata.name}')

          for POD in $PODS; do
            echo "--------------------------------------------------------"
            echo "🔎 Analisando Pod: $POD"
            echo "--------------------------------------------------------"
            
            # Tenta pegar o motivo da morte (Previous)
            echo "📜 LOGS DA ÚLTIMA MORTE (--previous):"
            if ! kubectl logs $POD --previous --tail=50 2>/dev/null; then
               echo "   (Sem logs anteriores ou container nunca subiu)"
            fi

            echo ""
            echo "📜 LOGS ATUAIS:"
            kubectl logs $POD --tail=50 --all-containers=true 2>/dev/null || echo "   (Não foi possível ler logs atuais)"
            
            echo ""
            echo "📋 EVENTOS (DESCRIBE):"
            # Pega só as últimas 15 linhas do describe (onde ficam os erros)
            kubectl describe pod $POD | grep -A 20 "Events:" || echo "   (Sem eventos)"
            
            echo ""
          done
  
  #########################################
  # Job 7: Criar Release no GitHub        #
  #########################################
  create-release:
    name: 'Create GitHub Release'
    needs: [deploy-k8s-app]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release using GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_URL: ${{ needs.deploy-k8s-app.outputs.load_balancer_url }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          
          # Cria o texto da Release
          # EOF permite escrever múltiplas linhas
          cat <<EOF > release_notes.md
          ## 🚀 Deploy Realizado com Sucesso!
          
          A nova versão da aplicação **Food Delivery** já está online.
          
          ### 🔗 Link de Acesso
          👉 **[Acessar Aplicação]($APP_URL)** ($APP_URL)
          OBS: Este link de acesso pode mudar, para validar o acesso verifique os deployments
          
          ### 📦 Detalhes Técnicos
          - **Versão:** $TAG_NAME
          - **Commit:** ${{ github.sha }}
          - **Autor:** @${{ github.actor }}
          
          ---
          *Deploy automatizado via GitHub Actions*
          EOF

          # Cria a Release usando o CLI nativo
          # --generate-notes: Adiciona automaticamente a lista de PRs/Commits mudados
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --notes-file release_notes.md \
            --latest

  #########################################
  # Job 8: Registrar Deploy no GitHub     #
  #########################################
  register-deployment:
    name: 'Update GitHub Environment'
    needs: [deploy-k8s-app]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      deployments: write

    steps:
      - name: Create Deployment & Status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_URL: ${{ needs.deploy-k8s-app.outputs.load_balancer_url }}
          BRANCH: main
        run: |
          echo "🚀 Criando registro de Deployment..."

          # 1. Cria o Objeto de Deployment
          # required_contexts[]='' é um truque para não ficar esperando outros checks passarem
          DEPLOYMENT_ID=$(gh api repos/${{ github.repository }}/deployments \
            -f ref='${{ github.sha }}' \
            -f environment='production' \
            -f description='Deploy automático no EKS' \
            -F production_environment=true \
            -f required_contexts[]='' \
            --jq '.id')

          echo "✅ Deployment ID criado: $DEPLOYMENT_ID"

          # 2. Atualiza o Status para SUCCESS e vincula o Link do App
          gh api repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses \
            -f state='success' \
            -f environment_url="$APP_URL" \
            -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description='Aplicação rodando e acessível'

          echo "✅ Status atualizado no GitHub Environments!"